spring:
  application:
    name: jpa-sns
  # 데이터베이스 접속 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://localhost:3306/jpa_db?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true'
    username: jpa-app
    password: 'Jpa1234!'

  # 데이터베이스 초기화를 설정
  sql:
    init:
      mode: always  # data.sql 초기화 실행
#      mode: never

  # JPA 및 하이버네이트 설정
  jpa:
    defer-datasource-initialization: true  # hibernate DDL 생성 완료 후 data.sql 로드 및 실행
    hibernate:
      ddl-auto: create
#      ddl-auto: none
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
