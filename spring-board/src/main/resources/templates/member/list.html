<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>회원 목록</title>
  <link rel="stylesheet" href="/board/css/common.css">
  <link rel="stylesheet" href="/board/css/list.css">
</head>
<body>
  <div class="container">
    <h1>회원 목록</h1>
    <div class="nav">
      <a href="register.html" class="btn">회원가입</a>
      <a href="login.html" class="btn btn-secondary">로그인</a>
    </div>
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>아이디</th>
          <th>이메일</th>
          <th>가입일</th>
        </tr>
      </thead>
      <tbody>
        <!-- 수강생 실습: 동적 데이터 바인딩 영역 -->
        <tr th:each="member : ${members}">
          <td th:text="${member.id}" >1</td>
          <td><a th:href="@{edit.html(id=${member.id})}" th:text="${member.username}"></a></td>
          <td th:text="${member.email}"></td>
          <td th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
