<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>스프링 게시판 - 새 글 쓰기</title>
  <link rel="stylesheet" href="/board/css/common.css">
  <link rel="stylesheet" href="/board/css/write.css">
  <!-- Editor's Style CDN-->
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />

</head>
<body>


    <div class="container">
      <th:block th:insert="~{layout/common :: nav-header(${postForm.id == 0} ? '게시글 등록' : '게시글 수정')}">
        <h1>게시글 상세 정보</h1>
        <div class="nav">
          <a href="list.html">목록으로</a>
          <a href="write.html">새 글 쓰기</a>
        </div>
      </th:block>

<!--    <h1 th:text="${postForm.id == 0}? '게시글 등록' : '게시글 수정'">게시글 등록</h1>-->
<!--    <div class="nav" th:replace="~{layout/common :: nav-header}">-->
<!--      <a href="list.html">목록으로</a>-->
<!--      <a href="write.html">새 글 쓰기</a>-->
<!--    </div>-->
<!--    <form th:action="@{${postForm.id == 0} ? 'write' : 'edit'}" method="POST" th:object="${postForm}">-->
    <form th:action="@{{action}(action=${postForm.id == 0} ? 'write' : 'edit')}" method="POST" th:object="${postForm}">
      <input type="hidden" th:field="*{id}">
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id ="title" th:field="*{title}" placeholder="제목을 입력하세요" required>
        <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">에러 메세지</div>
      </div>

      <div class="form-group">
        <label for="author">작성자</label>
        <input type="text" id="author" th:field="*{author}" placeholder="작성자 이름을 입력하세요" required>
        <div class="field-error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">에러 메세지</div>
      </div>


      <div class="form-group">
        <label for="content">내용</label>
        <input type="hidden" id="content" th:field="*{content}">
        <div class="field-error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">에러 메세지</div>
      </div>
      <div id="editor"></div>
      <div style="margin-top: 20px;">
        <button type="submit" class="btn" th:text="${postForm.id == 0} ? '등록' : '수정'">등록</button>
<!--        <a th:href="${postForm.id == 0} ? @{list.html} : @{detail.html(id=${postForm.id})}" class="btn btn-secondary">취소</a>-->
<!--        <a th:href="@{{action}(action=${postForm.id == 0} ? 'list.html' : 'detail.html(id=${postForm.id})')}" class="btn btn-secondary">취소</a>-->
            <a th:if="${postForm.id == 0}" th:href="@{list.html}" class="btn btn-secondary">취소</a>
            <a th:unless="${postForm.id == 0}" th:href="@{detail.html(id=${postForm.id})}" class="btn btn-secondary">취소</a>

      </div>
    </form>

  </div>
<!--    toastui CDN(js)-->
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script>
<!--       에디터 생성-->
      const editor = new toastui.Editor({
        el: document.querySelector('#editor'),
        height: '500px',
        initialEditType: 'markdown',
        initialValue: '',
        previewStyle: 'vertical',

        hooks: {
          async addImageBlobHook(blob, callback) { // 이미지 업로드 로직 커스텀
            try {
              /*
               * 1. 에디터에 업로드한 이미지를 FormData 객체에 저장
               *    (이때, 컨트롤러 uploadEditorImage 메서드의 파라미터인 'image'와 formData에 append 하는 key('image')값은 동일해야 함)
               */
              const formData = new FormData();
              formData.append('image', blob);

              // 2. FileApiController - uploadEditorImage 메서드 호출
              const response = await fetch('/homework/board/image-upload', {
                method: 'POST',
                body: formData,
              });

              // 3. 컨트롤러에서 전달받은 디스크에 저장된 파일명
              const filename = await response.text();
              console.log('서버에 저장된 파일명 : ', filename);

              // 4. addImageBlobHook의 callback 함수를 통해, 디스크에 저장된 이미지를 에디터에 렌더링
              const imageUrl = `/homework/board/image-print?filename=${filename}`;
              callback(imageUrl, 'image alt attribute');

            } catch (error) {
              console.error('업로드 실패 : ', error);
            }
          }
        }
      });
      const form = document.querySelector('form');
      form.addEventListener('submit', function (){
        document.querySelector("#content").value = editor.getMarkdown();
      })
      // const editor = new toastui.Editor({
      //   el: document.querySelector('#editor'), // 에디터를 적용할 요소 (컨테이너)
      //   height: '500px',                        // 에디터 영역의 높이 값 (OOOpx || auto)
      //   initialEditType: 'markdown',            // 최초로 보여줄 에디터 타입 (markdown || wysiwyg)
      //   initialValue: '',     // 내용의 초기 값으로, 반드시 마크다운 문자열 형태여야 함
      //   previewStyle: 'vertical'                // 마크다운 프리뷰 스타일 (tab || vertical)
      // });
    </script>
</body>
</html>
