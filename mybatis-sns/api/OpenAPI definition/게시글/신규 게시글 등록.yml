info:
  name: 신규 게시글 등록
  type: http
  seq: 5
  tags:
    - SNS 게시글 API

http:
  method: POST
  url: "{{baseUrl}}/api/v1/posts/:id"
  params:
    - name: id
      value: "3"
      type: path
      description: 삭제할 게시글 ID
  body:
    type: json
    data: |-
      {
        "content": "스프링부트 학습중...",
        "imageUrl": "https://sample.com/images/hello.png"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: 게시글 생성 성공
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: POST
      headers:
        - name: X-Member-Id
          value: "1"
          description: 작성자 회원 ID
      body:
        type: json
        data: |-
          {
            "content": "스프링부트 학습중...",
            "imageUrl": "https://sample.com/images/hello.png"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "memberId": "하루",
            "content": "밀크티 만드는 방법",
            "imageUrl": "https://sample.com/images/hello.png",
            "likeCount": 5,
            "createAt": "2026.08.29",
            "updateAt": "수정 날짜: 2026.08.30"
          }
  - name: 400 Response
    description: 입력값 유효성 검증 실패
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: POST
      headers:
        - name: X-Member-Id
          value: "1"
          description: 작성자 회원 ID
      body:
        type: json
        data: |-
          {
            "content": "스프링부트 학습중...",
            "imageUrl": "https://sample.com/images/hello.png"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0,
            "timestamp": "",
            "errors": [
              {
                "field": "",
                "rejectedValue": "",
                "reason": ""
              }
            ]
          }
  - name: 500 Response
    description: 내부 서버 오류
    request:
      url: "{{baseUrl}}/api/v1/posts"
      method: POST
      headers:
        - name: X-Member-Id
          value: "1"
          description: 작성자 회원 ID
      body:
        type: json
        data: |-
          {
            "content": "스프링부트 학습중...",
            "imageUrl": "https://sample.com/images/hello.png"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "code": "",
            "message": "",
            "status": 0,
            "timestamp": "",
            "errors": [
              {
                "field": "",
                "rejectedValue": "",
                "reason": ""
              }
            ]
          }

docs: 회원 ID와 게시글 본문, 이미지 URL을 전달받아 피드에 등록합니다.
